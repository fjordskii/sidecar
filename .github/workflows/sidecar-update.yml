# Sidecar template update rail.
#
# Weekly (and on demand), compares this repo's VERSION against the upstream template's and,
# if upstream is newer, opens a PR applying the template-owned files listed in
# sidecar-manifest.json. Your files are structurally untouchable:
#
#   - system: replaced with the upstream version
#   - system_setup: onboarding files (INTERVIEW, SETUP, the init command…), replaced only
#     while this repo is still UNINITIALIZED. Once your mandate is filled in, an interview
#     you already answered is finished business — skipped, and named in the PR body
#   - system_if_uninitialized: replaced ONLY while the file still contains {{PLACEHOLDER}}
#     markers — once setup filled it in, it's yours and is skipped (named in the PR body)
#   - system_if_absent: written ONLY when the file is missing. Accumulating files live here
#     (JOURNAL.md, DECISIONS.md, bot/state.json) — see the manifest's note
#   - user: never read, never touched
#
# MAJOR RELEASES ARE HELD. A release that can change a trading decision must not arrive as
# a ready-to-merge pull request. When upstream's MAJOR is ahead of yours the PR is opened as
# a DRAFT, its body drops every "this changes nothing" reassurance, and it tells you to run
# the behaviour diff yourself first. See the "MAJOR" block in the PR step for why this
# workflow does not run that diff for you.
#
# First run on a repo that predates this rail treats VERSION as 0.0.0 and opens a PR that
# backfills VERSION + sidecar-manifest.json without touching anything initialized.
#
# Known limit: a GitHub Actions token may not push changes to workflow files, so this rail
# cannot update itself. When .github/workflows/sidecar-update.yml changed upstream, the PR
# body says so — copy that one file by hand from the template repo.
#
# GitHub disables scheduled workflows after 60 days of repo inactivity. Live loops commit
# several times a day so this never fires for them; if your loop is paused long-term, press
# "Run workflow" manually when you come back.

name: Sidecar update

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC — off the top of the hour, out of market hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream
        id: src
        run: |
          # The manifest carries the upstream location so a renamed/moved template still works.
          if [ -f sidecar-manifest.json ]; then
            RAW="$(jq -r '.upstream.raw_base' sidecar-manifest.json)"
          else
            RAW="https://raw.githubusercontent.com/fjordskii/sidecar/main"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream manifest and version
        run: |
          curl -fsSL "${{ steps.src.outputs.raw }}/sidecar-manifest.json" -o /tmp/upstream-manifest.json
          curl -fsSL "${{ steps.src.outputs.raw }}/VERSION" -o /tmp/upstream-VERSION

      - name: Compare versions
        id: cmp
        run: |
          local_v="0.0.0"
          [ -f VERSION ] && local_v="$(tr -d '[:space:]' < VERSION)"
          remote_v="$(tr -d '[:space:]' < /tmp/upstream-VERSION)"
          echo "local=$local_v" >> "$GITHUB_OUTPUT"
          echo "remote=$remote_v" >> "$GITHUB_OUTPUT"
          # Update only when remote is strictly newer (semver sort).
          if [ "$local_v" != "$remote_v" ] && \
             [ "$(printf '%s\n%s\n' "$local_v" "$remote_v" | sort -V | head -n1)" = "$local_v" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

          # MAJOR-hold. By CHANGELOG.md's convention a MAJOR bump means "this can change a
          # trading decision", and such a release is opt-in and must not be installed before
          # a behaviour diff has been shown.
          #
          # The `[ -f VERSION ]` guard matters: a repo with no VERSION is at 0.0.0 and is
          # ADOPTING the rail, not crossing a major. Without the guard every pre-rail user
          # would meet this hold on the one PR that is meant to be easy.
          major_hold=false
          if [ -f VERSION ]; then
            local_major="${local_v%%.*}"; remote_major="${remote_v%%.*}"
            case "$local_major$remote_major" in
              *[!0-9]*) ;;                      # unparseable version — do not guess
              *) [ "$remote_major" -gt "$local_major" ] && major_hold=true ;;
            esac
          fi
          echo "major_hold=$major_hold" >> "$GITHUB_OUTPUT"

      - name: Apply template-owned files
        id: apply
        if: steps.cmp.outputs.update == 'true'
        run: |
          set -euo pipefail
          RAW="${{ steps.src.outputs.raw }}"
          : > /tmp/changed.txt
          : > /tmp/skipped.txt

          fetch() {
            mkdir -p "$(dirname "$1")"
            curl -fsSL "$RAW/$1" -o "$1"
            echo "$1" >> /tmp/changed.txt
          }

          # The one setup-token test, defined once and used by two classes below. It greps
          # for SPECIFIC tokens, never a blanket '{{': docs mention {{PLACEHOLDER}} in prose
          # and a blanket check would read an untouched SETUP.md as "uninitialized" forever.
          has_setup_tokens() {
            [ -f "$1" ] && grep -qE '\{\{(ACCOUNT_ID|BROKER|MCP_SERVER|STRATEGY|REPO_PATH|CLI_PATH|NODE_PATH|DATE|SLOTS|AUTONOMY|AUTONOMY_LINE)\}\}' "$1"
          }

          # Is THIS REPO still being onboarded? Asked of LOOP_PROMPT.md, because that is the
          # file setup actually fills in. The system_setup files cannot answer for themselves:
          # setup-schema.json and the init command carry no tokens at all, while SETUP.md and
          # ops/ROUTINE_PROMPT.md carry them only as printed examples that are never filled.
          if [ ! -f LOOP_PROMPT.md ] || has_setup_tokens LOOP_PROMPT.md; then
            uninitialized=true
          else
            uninitialized=false
          fi

          # system: always replaced
          while IFS= read -r f; do
            fetch "$f"
          done < <(jq -r '.files.system[]' /tmp/upstream-manifest.json)

          # system_setup: onboarding material. Delivered while this repo is still being set
          # up; once the mandate is filled in, these are finished business and updating them
          # is churn in a PR the user has to read. Declining them must never mean declining
          # engine or rail fixes, which is why they are their own class rather than a note.
          while IFS= read -r f; do
            if [ "$uninitialized" = "true" ]; then
              fetch "$f"
            else
              echo "$f" >> /tmp/skipped.txt
            fi
          done < <(jq -r '.files.system_setup[]? // empty' /tmp/upstream-manifest.json)

          # system_if_uninitialized: replaced only while real placeholder tokens remain.
          # A specific-token grep, not '{{' — templates mention {{PLACEHOLDER}} in prose
          # ("Fill in every {{PLACEHOLDER}}…"), which a blanket check would false-match
          # and clobber a filled file on every update.
          #
          # ONLY FILL-IN TEMPLATES MAY BE LISTED HERE. A file that accumulates content
          # belongs in system_if_absent below — see that block.
          while IFS= read -r f; do
            if [ -f "$f" ] && ! has_setup_tokens "$f"; then
              echo "$f" >> /tmp/skipped.txt
            else
              fetch "$f"
            fi
          done < <(jq -r '.files.system_if_uninitialized[]' /tmp/upstream-manifest.json)

          # system_if_absent: delivered ONLY when missing. The test is existence, never
          # content. JOURNAL.md and DECISIONS.md accumulate for months, so the token grep
          # above is the wrong question for them: it answers "still uninitialized" for as
          # long as ANY ONE token in the file's header is unfilled, no matter how many
          # real entries sit below it. Before 1.7.1 that meant a journal with two months
          # of cycles and a single {{AUTONOMY}} left in its standing rules was replaced
          # wholesale by the seed — while the PR body promised the journal was untouched.
          # Absent is the only condition under which it is safe to write these at all.
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              echo "$f" >> /tmp/skipped.txt
            else
              fetch "$f"
            fi
          done < <(jq -r '.files.system_if_absent[]? // empty' /tmp/upstream-manifest.json)

          cp /tmp/upstream-VERSION VERSION
          echo "VERSION" >> /tmp/changed.txt

          # The rail cannot update itself — flag drift for a manual copy instead.
          if curl -fsSL "$RAW/.github/workflows/sidecar-update.yml" -o /tmp/upstream-rail.yml \
             && ! cmp -s .github/workflows/sidecar-update.yml /tmp/upstream-rail.yml; then
            echo "rail_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rail_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update PR
        if: steps.cmp.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_V: ${{ steps.cmp.outputs.local }}
          REMOTE_V: ${{ steps.cmp.outputs.remote }}
          UPSTREAM: ${{ steps.src.outputs.raw }}
          RAIL_CHANGED: ${{ steps.apply.outputs.rail_changed }}
          MAJOR_HOLD: ${{ steps.cmp.outputs.major_hold }}
          # Named explicitly: the PR body prints a git command the user pastes, and under
          # `set -u` an unset variable would abort the job instead of writing the body.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          branch="sidecar-update/v$REMOTE_V"

          if [ "$(gh pr list --state open --head "$branch" --json number --jq 'length')" != "0" ]; then
            echo "Update PR for v$REMOTE_V already open — nothing to do."
            exit 0
          fi

          if git diff --quiet; then
            echo "Upstream is newer but no file changes apply (all initialized) — nothing to PR."
            exit 0
          fi

          git config user.name "sidecar-update"
          git config user.email "sidecar-update[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "sidecar: template update v$LOCAL_V → v$REMOTE_V"
          git push -u origin "$branch"

          # MAJOR: everything below changes shape. The reassurance line is dropped (it would
          # be a lie), the title says what this is, and the body leads with the diff.
          #
          # ⛔ Why this workflow does NOT run the behaviour diff for you: it runs on a fresh
          # checkout, and `bot/raw/` — the verbatim broker data the engine reads — is
          # gitignored and therefore absent here. `bot/cli/behaviour_diff.py` run against a
          # repo with no raw/ degrades: most of the decision surface (bands, bloc caps, risk
          # caps, sizing, the add channel) never executes, so it prints "no decision changes"
          # having tested almost nothing. A false all-clear on the one release most likely to
          # move money is worse than no check. The diff has to run where your data is.
          if [ "$MAJOR_HOLD" = "true" ]; then
            title="⚠ MAJOR — Sidecar update: v$LOCAL_V → v$REMOTE_V (behaviour diff required)"
          else
            title="Sidecar update: v$LOCAL_V → v$REMOTE_V"
          fi

          {
            if [ "$MAJOR_HOLD" = "true" ]; then
              echo "## ⚠ MAJOR update: v$LOCAL_V → v$REMOTE_V — do not merge yet"
              echo
              echo "A MAJOR bump means the template is telling you, in its own changelog"
              echo "convention, that **this release can change what your loop does with your"
              echo "money.** Every other update PR you get from this rail says the opposite."
              echo
              echo "**Read \`CHANGELOG.md\` in this PR first.** Its newest entry names which"
              echo "decisions change and how."
              echo
              echo "### Then see what it would do to YOUR book"
              echo
              echo "Run this in your clone, after a cycle has fetched \`bot/raw/\` — the diff"
              echo "is only meaningful against your real data, and it says so itself if it is"
              echo "under-powered. It never writes to your repo:"
              echo
              echo '```bash'
              echo "git fetch origin"
              echo "git worktree add /tmp/sc-now origin/$DEFAULT_BRANCH"
              echo "git worktree add /tmp/sc-new origin/$branch"
              echo "python3 /tmp/sc-new/bot/cli/behaviour_diff.py \\"
              echo "    --old /tmp/sc-now --new /tmp/sc-new --instance . --text-diff"
              echo '```'
              echo
              echo "It prints every gate, cap, sizing band and REQUIRED ACTION that would"
              echo "differ today. If it reports decision changes you did not expect, close"
              echo "this PR — you are not behind, you are declining a change of behaviour."
              echo
              echo "Clean up with \`git worktree remove /tmp/sc-now /tmp/sc-new\`."
              echo
              echo "---"
              echo
              echo "### Files in this PR"
            else
              echo "## Sidecar template update: v$LOCAL_V → v$REMOTE_V"
              echo
              echo "Automated pull of template-owned files from the upstream Sidecar template."
              echo "**Merging this changes nothing about your strategy, journal, profile, or schedule.**"
              echo
            fi
            echo "### Updated"
            sed 's/^/- `/' /tmp/changed.txt | sed 's/$/`/'
            echo
            if [ -s /tmp/skipped.txt ]; then
              echo "### Skipped — yours, or already behind you"
              echo "These changed upstream and were left alone: either setup filled them in and"
              echo "they are yours now, or they are onboarding material this repo is past."
              echo "Skim the upstream diff if you're curious:"
              sed 's/^/- `/' /tmp/skipped.txt | sed 's/$/`/'
              echo
            fi
            if [ "$RAIL_CHANGED" = "true" ]; then
              echo "### ⚠️ Manual step: the update workflow itself changed"
              echo "GitHub doesn't let a workflow update workflow files. Copy the new"
              echo "\`.github/workflows/sidecar-update.yml\` from the template repo over this one."
              echo
            fi
            echo "---"
            echo "Upstream changes: <https://github.com/fjordskii/sidecar/commits/main>"
          } > /tmp/pr-body.md

          # Draft is the gate: a draft cannot be merged until someone deliberately marks it
          # ready. Draft PRs are not available on every private-repo plan, so fall back to a
          # normal PR rather than failing — the title and body still carry the warning.
          if [ "$MAJOR_HOLD" = "true" ]; then
            gh pr create --draft --title "$title" --body-file /tmp/pr-body.md \
              || gh pr create --title "$title" --body-file /tmp/pr-body.md
          else
            gh pr create --title "$title" --body-file /tmp/pr-body.md
          fi
