name: CI

# Sidecar is PUBLIC and is cloned by people who then point it at a real brokerage account.
# One thing must be true of every commit on main: no personal data has leaked into it —
# one account number is all it takes. That is not a thing a reviewer catches twice.
#
# ⚠ These jobs run ONLY on the upstream template. A clone's LOOP_PROMPT.md legitimately
# contains its owner's real account number, so an ungated scan would fail every commit in
# every one of those repos, three times a day, forever. The repository guard below is what
# keeps this gate from becoming the thing that interrupts a user's loop.
#
# Since v2.0.0 the template's LOOP_PROMPT.md calls the engine, so a new clone runs bot/
# against a real brokerage account on its first cycle. CI is the only thing that exercises
# it before they do, so the tests below are not a formality.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (blocks the build)
    if: github.repository == 'fjordskii/sidecar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate. Anything shaped like a real brokerage account number, a journal cycle
      # entry, populated state, a personal path or an email fails the build.
      - name: Scan the working tree
        run: python3 tools/secret_scan.py

      # A leak that is force-pushed away is still a leak, and git history is forever — so
      # scan every commit introduced by this push/PR, not just the final tree.
      - name: Scan the commits this change introduces
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A force-push leaves `before` pointing at a commit this checkout no longer has,
          # and an empty/zero base is a branch's first push. Neither is a scannable range.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit — scanning the tree only"; exit 0
          fi
          fail=0
          for sha in $(git rev-list "$base..HEAD"); do
            tmp="$(mktemp -d)"
            git archive "$sha" | tar -x -C "$tmp"
            if ! python3 tools/secret_scan.py --path "$tmp" > "$tmp/.out" 2>&1; then
              echo "::error::secret scan failed in commit $sha"
              sed "s#$tmp#<commit $sha>#g" "$tmp/.out"
              fail=1
            fi
            rm -rf "$tmp"
          done
          exit $fail

  tests:
    name: tests
    if: github.repository == 'fjordskii/sidecar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install, on purpose. A clone must run from a bare checkout with nothing but
      # the standard library — if a test needs a package, the engine will eventually need
      # it too, and then someone's 09:30 cycle fails inside a container nobody is watching.
      - name: Assert the engine has no third-party imports
        run: |
          set -euo pipefail
          # No pip install anywhere in this workflow, on purpose — see above. `try:` guards
          # a deferred import (schema_check prefers jsonschema when it is already there).
          if grep -rnE '^\s*(import|from)\s+(yaml|jsonschema|requests|pydantic|numpy|pandas)\b' \
               bot/ tools/ tests/ --include='*.py' | grep -v 'except' | grep -v '# optional'; then
            echo "::error::bot/ must not require third-party packages at import time"
            exit 1
          fi

      - name: Tests (standard library only)
        run: cd tests && python3 -m unittest discover -p 'test_*.py' -v

      # The shipped engine payload, asserted here as well as in the tests: this is the file
      # that would carry somebody's book into a public template, and it is worth two locks.
      - name: The shipped state template is empty and carries no identity
        run: |
          python3 - <<'PY'
          import json
          st = json.load(open("bot/state.json"))
          assert st["positions"] == {} and st["bench"] == {}, "shipped state is not empty"
          assert st["benchmark_history"] == [], "shipped state carries history"
          assert st["account_number"] == "", "shipped state carries an account id"
          bloc = st["policy"]["ai_bloc"]
          assert bloc["members"] == [], "shipped bloc names somebody's holdings"
          assert bloc["label"] == "", "shipped bloc carries somebody's theme"
          assert st["policy"]["bands"]["levered_names"] == []
          assert open("bot/failures.jsonl").read() == "", "shipped ledger is not empty"
          print("templates OK")
          PY

      # tools/secret_scan.py skips directories named raw/ so a local run is not drowned by
      # the user's own gitignored broker dumps. That leaves one hole the scanner cannot see:
      # a bot/raw/ that got COMMITTED. Close it here — it is the exact leak shape.
      - name: No private engine working files are tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch 'bot/raw/*' 'bot/brief.md' 2>/dev/null | grep .; then
            echo "::error::bot/raw/ or bot/brief.md is tracked — that is live broker data"
            exit 1
          fi
          echo "no private engine files tracked"

      # Every release answers "could this change what my loop does with my money?" before
      # anything else. An unmarked entry means nobody established it — which is exactly the
      # state CHANGELOG.md's rule 1 refuses to ship.
      - name: The newest CHANGELOG entry states its decision impact
        run: |
          set -euo pipefail
          top="$(awk '/^## \[/{n++} n==1' CHANGELOG.md)"
          if [ -z "$top" ]; then
            echo "::error::no '## [version]' entry found in CHANGELOG.md"; exit 1
          fi
          if ! grep -qE 'DECISION: (no|YES)' <<< "$top"; then
            echo "::error::the newest CHANGELOG entry has no 'DECISION: no|YES' line"; exit 1
          fi
          if grep -q 'DECISION: unknown' <<< "$top"; then
            echo "::error::'DECISION: unknown' is not shippable"; exit 1
          fi
          # The entry's version must be the one this commit actually ships.
          entry_v="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' <<< "$top" | head -n1)"
          file_v="$(tr -d '[:space:]' < VERSION)"
          if [ "$entry_v" != "$file_v" ]; then
            echo "::error::CHANGELOG's newest entry is $entry_v but VERSION says $file_v"; exit 1
          fi
          echo "changelog OK — $entry_v"

      # Invariant 2 (BACKPORT.md). AGENTS.md is replaced wholesale on every update — it is
      # the ONE file that reaches an initialized repo unchanged. A single engine reference in
      # it would therefore switch the engine on in every existing user's next cycle without
      # their consent. v2.0.0 activates the engine through LOOP_PROMPT.md, which is the
      # user's own file and which the rail never touches; this check is what keeps that the
      # only route in.
      - name: AGENTS.md names no engine file
        run: |
          set -euo pipefail
          if grep -nE 'bot/|precheck|postcheck|brief\.md|state\.json' AGENTS.md; then
            echo "::error::AGENTS.md must not reference the engine — see BACKPORT.md invariant 2"
            exit 1
          fi
          echo "AGENTS.md is engine-free"
